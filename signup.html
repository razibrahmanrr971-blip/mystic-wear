<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - Mystic Wear</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
<div class="logo">
Mystic Wear
</div>
<nav class="navbar">
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="cart.html">Cart</a>
<a href="login.html">Login</a>
<a href="signup.html">Signup</a>
<a href="contact.html">Contact</a>
</nav>
</header>
<section class="section">
<h2 class="section-title">
Create Account
</h2>
<div style="max-width:500px;margin:auto;background:#181818;padding:40px;border-radius:15px;">
<input
type="text"
placeholder="Full Name"
style="width:100%;padding:15px;margin-bottom:15px;border:none;border-radius:10px;">
<input
type="email"
placeholder="Email Address"
style="width:100%;padding:15px;margin-bottom:15px;border:none;border-radius:10px;">
<input
type="password"
placeholder="Password"
style="width:100%;padding:15px;margin-bottom:15px;border:none;border-radius:10px;">
<input
type="password"
placeholder="Confirm Password"
style="width:100%;padding:15px;margin-bottom:15px;border:none;border-radius:10px;">
<button
style="width:100%;padding:15px;background:gold;border:none;font-weight:bold;border-radius:10px;">
Create Account
</button>
<p style="text-align:center;margin-top:20px;">
Already have an account?
<a href="login.html" style="color:gold;">
Login
</a>
</p>
</div>
</section>
<script src="script.js"></script>
</body>
</html>
