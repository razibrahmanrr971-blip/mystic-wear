<!DOCTYPE html>
<html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Mystic Wear</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<div class="logo">Mystic Wear</div>
</header>
<section class="products">

<div style="max-width:400px;margin:auto;background:#1a1a1a;padding:30px;border-radius:15px;">

Login
</button>
</div>
</section>
